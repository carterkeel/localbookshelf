name: Build APK

on:
  push:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  pull_request:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  workflow_dispatch: # lets you start a build manually from the Actions tab
jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the release step below publish the APK
    steps:
      - name: checkout sources
        uses: actions/checkout@v4

      - name: use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci --omit=optional

      - name: test local library parsing
        run: npm run test:local

      - name: build Nuxt project
        run: npm run generate

      - name: copy to Android project
        run: npx cap sync

      - name: build Android app
        run: ./android/gradlew assembleDebug -p android --no-daemon

      - name: rename apk
        working-directory: android/app/build/outputs/apk/debug/
        run: |
          build="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          name="audiobookshelf-${build}.apk"
          mv -v app-debug.apk "${name}"

      - name: upload app
        uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Publish the newest build from main as a normal download on the repo's Releases page
      - name: publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/audiobookshelf-*.apk Localbookshelf.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Localbookshelf.apk --target "$GITHUB_SHA" --prerelease \
            --title "Localbookshelf (latest build)" \
            --notes "Automatic build of commit ${GITHUB_SHA::7} from main. Download Localbookshelf.apk and install it on your Android phone."
