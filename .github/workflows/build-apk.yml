name: Build APK

on:
  push:
    tags:
      - 'v*' # v0.1.0 etc. publish a versioned release
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  pull_request:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  workflow_dispatch: # lets you start a build manually from the Actions tab
jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout sources
        uses: actions/checkout@v4

      - name: use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci --omit=optional

      - name: test local library parsing
        run: npm run test:local

      - name: build Nuxt project
        run: npm run generate

      - name: copy to Android project
        run: npx cap sync

      - name: build Android app
        run: ./android/gradlew assembleDebug -p android --no-daemon

      - name: rename apk
        working-directory: android/app/build/outputs/apk/debug/
        run: |
          build="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          name="audiobookshelf-${build}.apk"
          mv -v app-debug.apk "${name}"

      - name: upload app
        uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # Publishing is a separate job so the build (npm install, Gradle) never runs with a write token.
  release:
    needs: main
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download APK
        uses: actions/download-artifact@v4
        with:
          name: audiobookshelf-apk

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cp audiobookshelf-*.apk Localbookshelf.apk
          if [ "$REF_TYPE" = "tag" ]; then
            # A versioned release, e.g. v0.1.0
            gh release delete "$REF_NAME" --repo "$REPO" --yes || true
            gh release create "$REF_NAME" Localbookshelf.apk --repo "$REPO" --verify-tag --latest \
              --title "Localbookshelf $REF_NAME" \
              --notes "Install Localbookshelf.apk on an Android phone (allow installs from your browser or file manager when asked). This build is signed with a temporary debug key, so to install a newer version you may need to uninstall this one first."
          else
            # Rolling build of main
            gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
            gh release create latest Localbookshelf.apk --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
              --title "Localbookshelf (latest build)" \
              --notes "Automatic build of commit ${GITHUB_SHA::7} from main. Install Localbookshelf.apk on an Android phone."
          fi
